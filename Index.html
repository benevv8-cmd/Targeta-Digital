<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benedicto Villar Vargas - Tarjeta Digital</title>
    <!-- Tipografía corporativa limpia -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Iconos Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-color: #0b111e;
            --card-bg: #131b2e;
            --accent-copper: #d97706;
            --accent-cyan: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .card-container {
            width: 100%;
            max-width: 400px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        /* Fondo esquemático de transformador de potencia */
        .card-header {
            position: relative;
            padding: 35px 25px 20px 25px;
            background: linear-gradient(180deg, rgba(11, 17, 30, 0.8) 0%, rgba(19, 27, 46, 1) 100%),
                        url('transformer-bg.svg') center/cover no-repeat;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        .company-tag {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--accent-cyan);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .name {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .title {
            font-size: 0.9rem;
            font-weight: 400;
            color: var(--accent-copper);
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .card-body {
            padding: 25px;
        }

        .cta-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .btn-primary {
            background-color: var(--accent-copper);
            color: #ffffff;
            border: none;
        }

        .btn-primary:active {
            opacity: 0.9;
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: #1e293b;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:active {
            background-color: #334155;
            transform: scale(0.98);
        }

        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 25px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.875rem;
            color: var(--text-muted);
            text-decoration: none;
        }

        .contact-item i {
            color: var(--accent-cyan);
            width: 20px;
        }

        .qr-section {
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .qr-section p {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .qr-code {
            background: #ffffff;
            padding: 10px;
            border-radius: 12px;
            display: inline-block;
        }

        .qr-code img {
            width: 130px;
            height: 130px;
            display: block;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- Encabezado Visual -->
        <div class="card-header">
            <div class="company-tag">Delta Star Inc.</div>
            <h1 class="name">Benedicto Villar Vargas</h1>
            <p class="title">Team Leader – Mechanical Design</p>
            <p class="subtitle">Internal Transformer Components</p>
        </div>

        <!-- Cuerpo de Acción y Contacto -->
        <div class="card-body">
            <!-- Botones Principales -->
            <div class="cta-buttons">
                <a href="contacto.vcf" download class="btn btn-primary">
                    <i data-lucide="user-plus"></i> Guardar Contacto (.vcf)
                </a>
                <a href="https://www.linkedin.com/in/benedicto-villar-vargas" target="_blank" class="btn btn-secondary">
                    <i data-lucide="linkedin"></i> Perfil de LinkedIn
                </a>
            </div>

            <!-- Lista de Contacto Directo -->
            <div class="contact-list">
                <a href="mailto:tu-correo@deltastar.com" class="contact-item">
                    <i data-lucide="mail"></i>
                    <span>tu-correo@deltastar.com</span>
                </a>
                <a href="tel:+10000000000" class="contact-item">
                    <i data-lucide="phone"></i>
                    <span>+1 (XXX) XXX-XXXX</span>
                </a>
                <div class="contact-item">
                    <i data-lucide="map-pin"></i>
                    <span>Saint-Jean-sur-Richelieu, QC, Canadá</span>
                </div>
            </div>

            <!-- Código QR Integrado -->
            <div class="qr-section">
                <p>Escanea para compartir o abrir esta tarjeta</p>
                <div class="qr-code">
                    <!-- Genera automáticamente el QR dinámico a esta misma página -->
                    <img id="qr-img" src="" alt="Código QR">
                </div>
            </div>
        </div>
    </div>

    <script>
        // Inicializar iconos de Lucide
        lucide.createIcons();

        // Generar QR dinámico apuntando a la URL actual
        document.getElementById('qr-img').src = 
            'https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=' + encodeURIComponent(window.location.href);
    </script>
</body>
</html>
